{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="col-6">
        <form method="post" enctype="multipart/form-data" class="mt-3">
            <div class="card">
                <div class="card-body">
                    {% csrf_token %}
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-primary">Войти</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
