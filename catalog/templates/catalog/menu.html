<div class="d-flex flex-column flex-md-row align-items-center justify-content-between p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Продукты.ру</h5>
    <nav class="ms-5 me-auto">
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:home' %}">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:contacts' %}">Контакты</a>
    </nav>
    <a href="{% url 'catalog:product_create' %}" class="ms-automs-auto btn btn-primary">Добавить товар</a>
    <nav class="ms-auto">
        {% if user.is_authenticated %}
        <form method="post" action="{% url 'users:logout' %}">
            {% csrf_token %}
            <button type="submit" class="ms-automs-auto btn btn-outline-primary">Выход</button>
        </form>
        {% else %}
        <a href="{% url 'users:register' %}" class="ms-automs-auto btn btn-outline-primary">Регистрация</a>
        <a href="{% url 'users:login' %}" class="ms-automs-auto btn btn-outline-primary">Вход</a>
        {% endif %}
    </nav>

</div>
